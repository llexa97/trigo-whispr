name: "Release"

on: workflow_dispatch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) {
                throw new Error(`Release ${tag} is already published; bump the application version first.`);
              }
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                target_commitish: context.sha
              });
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # No Apple/Azure certificate is required, but the updater artifacts are
      # signed with TAURI_SIGNING_PRIVATE_KEY so installed apps can self-update.
      sign-binaries: false
      sign-updater: true
      asset-prefix: "trigo-whispr"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  publish-release:
    permissions:
      contents: write
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed Windows and macOS release
        uses: actions/github-script@v9
        with:
          script: |
            const release_id = Number('${{ needs.create-release.outputs.release-id }}');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id
            });
            if (!assets.some(asset => /\.(exe|msi)$/i.test(asset.name) && asset.size > 0)) {
              throw new Error('No Windows installer was uploaded; keeping the release as a draft.');
            }
            if (!assets.some(asset => /\.dmg$/i.test(asset.name) && asset.size > 0)) {
              throw new Error('No macOS installer was uploaded; keeping the release as a draft.');
            }
            if (!assets.some(asset => asset.name === 'latest.json' && asset.size > 0)) {
              throw new Error('No latest.json was uploaded; installed apps could not find this update, keeping the release as a draft.');
            }
            if (!assets.some(asset => /\.sig$/i.test(asset.name) && asset.size > 0)) {
              throw new Error('No updater signature was uploaded; keeping the release as a draft.');
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false
            });
